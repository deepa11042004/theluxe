services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=the_luxe_yatra_super_secret_jwt_key_2026_phase1
      - JWT_EXPIRES_IN=7d
      # Payment + email settings: set these in the hosting environment (never commit the values)
      - ENABLE_TEST_PLAN=${ENABLE_TEST_PLAN:-false}
      - PAYU_MODE=${PAYU_MODE:-test}
      - PAYU_TEST_KEY=${PAYU_TEST_KEY:-}
      - PAYU_TEST_SALT=${PAYU_TEST_SALT:-}
      - PAYU_LIVE_KEY=${PAYU_LIVE_KEY:-}
      - PAYU_LIVE_SALT=${PAYU_LIVE_SALT:-}
      - PAYU_CALLBACK_BASE_URL=${PAYU_CALLBACK_BASE_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:5001
    depends_on:
      - backend
    restart: unless-stopped
